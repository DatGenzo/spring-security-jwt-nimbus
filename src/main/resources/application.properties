spring.application.name=spring-security-jwt-nimbus
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8091}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.jackson.serialization.write-dates-as-timestamps=false

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:spring-security-jwt-nimbus}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}

app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:123456}
app.admin.full-name=${ADMIN_FULL_NAME:Do Thanh Dat}
