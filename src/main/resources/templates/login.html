<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JWT Nimbus</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head>
<body id="login-page" class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Spring Security JWT Nimbus</span></div></nav>
<main class="container py-5"><div class="row g-4 justify-content-center"><div class="col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3">Đăng nhập</h1><div id="login-message"></div>
<form id="login-form"><label class="form-label mt-2">Email</label><input id="login-email" type="email" class="form-control" value="admin@example.com" required><label class="form-label mt-3">Mật khẩu</label><input id="login-password" type="password" class="form-control" value="123456" required><button class="btn btn-primary w-100 mt-3">Đăng nhập</button></form></div></div></div>
<div class="col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h2 class="h3">Đăng ký</h2><div id="register-message"></div><form id="register-form"><label class="form-label mt-2">Họ tên</label><input id="register-name" class="form-control" value="Sinh viên JWT" required><label class="form-label mt-3">Email</label><input id="register-email" type="email" class="form-control" required><label class="form-label mt-3">Mật khẩu</label><input id="register-password" type="password" class="form-control" value="123456" required><button class="btn btn-success w-100 mt-3">Đăng ký</button></form></div></div></div></div></main>
<footer class="bg-dark text-white text-center py-3">Đỗ Thành Đạt | MSSV: 24110192 | Nimbus JOSE + JWT</footer><script src="/js/main.js"></script></body></html>
